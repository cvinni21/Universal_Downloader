<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="mark">↓</span><div><strong>Universal Downloader</strong><small>Integração com navegador</small></div></header>
    <section class="status"><span class="dot"></span><span id="status">Conferindo integração…</span></section>
    <label class="toggle-row"><span><strong>Interceptar downloads</strong><small>Enviar automaticamente downloads iniciados no navegador</small></span><input id="auto" type="checkbox"><i></i></label>
    <p class="note">Desativado por padrão. Você também pode clicar com o botão direito em um link e escolher <b>Baixar link com Universal Downloader</b>.</p>
    <footer>Requer o Universal Downloader e a integração nativa instalados.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
